<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free OTP Gateway</title>
  <style>
    :root {
      --bg-app: #080808;
      --bg-header: #121212;
      --bg-card: #1E1E1E;
      --bg-elevated: #262626;
      --bg-input: #141414;
      --bg-code: #141414;
      --border: #383838;
      --divider: #333333;
      --border-focus: #60A5FA;
      --text-primary: #F5F5F5;
      --text-secondary: #B3B3B3;
      --text-muted: #949494;
      --text-placeholder: #A0A0A0;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --link: #60A5FA;
      --success: #22C55E;
      --success-bg: #142E1D;
      --sent: #60A5FA;
      --sent-bg: #16263F;
      --warning: #F59E0B;
      --warning-bg: #332610;
      --danger: #F87171;
      --danger-border: #EF4444;
      --danger-bg: #331616;
      --info: #38BDF8;
      --auth: #A78BFA;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--divider);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .brand h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); line-height: 1.25; }
    .brand small { color: var(--text-secondary); font-size: 12px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #1E462D;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    .container {
      max-width: 1120px;
      width: 100%;
      margin: 16px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      flex: 1;
    }
    @media (min-width: 860px) {
      .container { grid-template-columns: 380px minmax(0, 1fr); }
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      min-height: 44px;
      transition: border-color 0.15s;
    }
    input::placeholder, textarea::placeholder { color: var(--text-placeholder); }
    input:focus, textarea:focus { border-color: var(--border-focus); }
    textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #FFFFFF; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border);
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .btn-secondary:hover:not(:disabled) { background: #303030; }
    .btn-tertiary {
      background: transparent;
      color: var(--link);
      min-height: 36px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .btn-tertiary:hover { background: rgba(96, 165, 250, 0.1); }
    .otp-helpers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .api-key-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--auth);
      word-break: break-all;
    }
    .key-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .helper-text { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
    .helper-text code {
      font-family: var(--font-mono);
      color: var(--info);
      background: var(--bg-code);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .table-wrapper {
      overflow-x: auto;
      max-height: 440px;
      overflow-y: auto;
      border: 1px solid var(--divider);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-weight: 600;
      padding: 10px 12px;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--divider);
      vertical-align: top;
      color: var(--text-primary);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-delivered { background: var(--success-bg); color: var(--success); }
    .badge-sent { background: var(--sent-bg); color: var(--sent); }
    .badge-pending { background: var(--warning-bg); color: var(--warning); }
    .badge-failed { background: var(--danger-bg); color: var(--danger); }
    .tab-list {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--divider);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #FFFFFF;
      background: var(--primary);
    }
    pre {
      background: var(--bg-code);
      color: #E5E5E5;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.45;
      overflow-x: auto;
      border: 1px solid var(--border);
      white-space: pre;
    }
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      display: none;
      z-index: 100;
      font-size: 13px;
      font-weight: 500;
    }
    .toast.show { display: block; animation: slideUp 0.18s ease-out; }
    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="7" rx="1"></rect>
          <rect x="2" y="14" width="20" height="7" rx="1"></rect>
          <line x1="6" y1="6.5" x2="6.01" y2="6.5"></line>
          <line x1="6" y1="17.5" x2="6.01" y2="17.5"></line>
        </svg>
      </div>
      <div>
        <h1>Free OTP Gateway</h1>
        <small>Android Local Cellular Bridge</small>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="serverStatusText">Online &middot; Port {{PORT}}</span>
    </div>
  </header>

  <div class="container">
    <div class="col">

      <!-- Send SMS Card -->
      <div class="card">
        <div class="card-title">
          <span class="card-title-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            Send SMS / OTP
          </span>
        </div>

        <form id="sendForm">
          <div class="form-group">
            <label for="phoneNumber">Recipient Phone Number</label>
            <input type="tel" id="phoneNumber" placeholder="+918114963709" value="+91" required>
          </div>

          <div class="form-group">
            <label for="message">Message / OTP Content</label>
            <textarea id="message" required placeholder="Your verification code is 123456">Your OTP is 492018. Valid for 10 minutes.</textarea>
            <div class="otp-helpers">
              <button type="button" class="btn btn-secondary" onclick="generateOtp()">Generate 6-Digit OTP</button>
              <button type="button" class="btn btn-secondary" onclick="generate4DigitOtp()">4-Digit OTP</button>
            </div>
          </div>

          <button type="submit" id="sendBtn" class="btn btn-primary">Send Message</button>
        </form>
      </div>

      <!-- API Authentication Card -->
      <div class="card">
        <div class="card-title">
          <span class="card-title-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            API Authentication
          </span>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <div class="api-key-box">
            <span id="apiKeyDisplay"></span>
            <div class="key-actions">
              <button type="button" id="revealKeyBtn" class="btn btn-tertiary" onclick="toggleApiKey()">Reveal</button>
              <button type="button" class="btn btn-secondary" onclick="copyApiKey()">Copy</button>
            </div>
          </div>
        </div>
        <p class="helper-text">
          Send requests to <code id="endpointPreview">http://localhost:{{PORT}}/api/send</code> with the <code>X-API-Key</code> header.
        </p>
      </div>

    </div>

    <div class="col">

      <!-- SMS History Card -->
      <div class="card" style="flex:1;">
        <div class="card-title">
          <span class="card-title-left">Outbound SMS History</span>
          <button type="button" class="btn btn-secondary" onclick="fetchHistory()">Refresh</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Recipient</th>
                <th>Message</th>
                <th>Status</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:24px;">Loading messages...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Integration Examples Card -->
      <div class="card">
        <div class="card-title">
          <span class="card-title-left">Request Examples</span>
          <button type="button" class="btn btn-tertiary" onclick="copyCurrentSnippet()">Copy Code</button>
        </div>
        <div class="tab-list">
          <button type="button" class="tab-btn active" onclick="switchSnippet('curl', this)">cURL</button>
          <button type="button" class="tab-btn" onclick="switchSnippet('python', this)">Python</button>
          <button type="button" class="tab-btn" onclick="switchSnippet('js', this)">JavaScript</button>
        </div>
        <pre id="snippetCode"></pre>
      </div>

    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const API_KEY = "{{API_KEY}}";
    const BASE_URL = window.location.origin;
    let isKeyVisible = false;
    let activeSnippet = "curl";

    document.getElementById("endpointPreview").textContent = BASE_URL + "/api/send";

    function renderApiKey() {
      const el = document.getElementById("apiKeyDisplay");
      const btn = document.getElementById("revealKeyBtn");
      if (isKeyVisible) {
        el.textContent = API_KEY;
        btn.textContent = "Hide";
      } else {
        el.textContent = API_KEY.length > 12
          ? API_KEY.slice(0, 8) + "••••••••" + API_KEY.slice(-4)
          : "••••••••••••";
        btn.textContent = "Reveal";
      }
    }

    function toggleApiKey() {
      isKeyVisible = !isKeyVisible;
      renderApiKey();
    }

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.borderColor = isSuccess ? "var(--success)" : "var(--danger-border)";
      toast.style.color = isSuccess ? "var(--text-primary)" : "var(--danger)";
      toast.className = "toast show";
      setTimeout(() => { toast.className = "toast"; }, 3500);
    }

    function copyApiKey() {
      navigator.clipboard.writeText(API_KEY);
      showToast("API key copied to clipboard");
    }

    function generateOtp() {
      const code = Math.floor(100000 + Math.random() * 900000);
      document.getElementById("message").value = "Your OTP is " + code + ". Valid for 10 minutes.";
    }

    function generate4DigitOtp() {
      const code = Math.floor(1000 + Math.random() * 9000);
      document.getElementById("message").value = "Your OTP is " + code + ". Valid for 5 minutes.";
    }

    function getStatusBadge(status) {
      const s = (status || "PENDING").toUpperCase();
      if (s === "DELIVERED") return '<span class="badge badge-delivered">Delivered</span>';
      if (s === "SENT") return '<span class="badge badge-sent">Sent</span>';
      if (s === "FAILED") return '<span class="badge badge-failed">Failed</span>';
      return '<span class="badge badge-pending">Pending</span>';
    }

    async function fetchHistory() {
      const tbody = document.getElementById("historyBody");
      try {
        const res = await fetch(BASE_URL + "/api/history?api_key=" + encodeURIComponent(API_KEY));
        const data = await res.json();
        if (data.success && data.data) {
          if (data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:24px;">No messages sent yet.</td></tr>';
            return;
          }
          tbody.innerHTML = data.data.map(item => {
            const time = item.timestamp ? new Date(item.timestamp).toLocaleTimeString() : "-";
            return `
              <tr>
                <td style="color:var(--text-muted); font-family:var(--font-mono);">#${item.sms_id || "-"}</td>
                <td style="white-space:nowrap;"><strong>${escapeHtml(item.phone_number || "")}</strong></td>
                <td style="color:var(--text-secondary); word-break:break-word;">${escapeHtml(item.message || "")}</td>
                <td>${getStatusBadge(item.status)}</td>
                <td style="color:var(--text-muted); font-size:12px; white-space:nowrap;">${time}</td>
              </tr>
            `;
          }).join("");
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--danger); padding:16px;">Failed to load history</td></tr>';
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("sendForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sendBtn = document.getElementById("sendBtn");
      const phone = document.getElementById("phoneNumber").value.trim();
      const msg = document.getElementById("message").value.trim();

      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";

      try {
        const res = await fetch(BASE_URL + "/api/send", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY
          },
          body: JSON.stringify({ phone_number: phone, message: msg })
        });
        const result = await res.json();
        if (result.success) {
          showToast("SMS queued successfully (ID: #" + result.sms_id + ")", true);
          fetchHistory();
        } else {
          showToast(result.error || "Failed to send SMS", false);
        }
      } catch (err) {
        showToast("Connection error: " + err.message, false);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send Message";
      }
    });

    const snippets = {
      curl: `curl -X POST ${BASE_URL}/api/send \\
  -H "Content-Type: application/json" \\
  -H "X-API-Key: <YOUR_API_KEY>" \\
  -d '{"phone_number": "+918114963709", "message": "Your OTP is 123456"}'`,
      python: `import requests

res = requests.post(
    "${BASE_URL}/api/send",
    headers={"X-API-Key": "<YOUR_API_KEY>"},
    json={"phone_number": "+918114963709", "message": "Your OTP is 123456"}
)
print(res.json())`,
      js: `const res = await fetch("${BASE_URL}/api/send", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "X-API-Key": "<YOUR_API_KEY>"
  },
  body: JSON.stringify({
    phone_number: "+918114963709",
    message: "Your OTP is 123456"
  })
});
console.log(await res.json());`
    };

    function switchSnippet(type, btn) {
      activeSnippet = type;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("snippetCode").textContent = snippets[type];
    }

    function copyCurrentSnippet() {
      navigator.clipboard.writeText(snippets[activeSnippet]);
      showToast("Code snippet copied to clipboard");
    }

    renderApiKey();
    switchSnippet("curl", document.querySelector(".tab-btn.active"));
    fetchHistory();
    setInterval(fetchHistory, 5000);
  </script>
</body>
</html>
